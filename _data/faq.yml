- question: What is DotNetSheff?
  answer: >
    DotNetSheff is a friendly Sheffield tech meetup for anyone interested in software development, .NET, AI, web, cloud, games, architecture, and modern engineering.

- question: When does dotnetsheff run?
  answer: >
    DotNetSheff usually runs monthly in person and starts at 18:30. Check our [meetup page](https://www.meetup.com/dotnetsheff/) for the latest date.

- question: Where is dotnetsheff hosted?
  answer: >
    We host events across Sheffield Hallam University, Sheffield Technology Parks, and Goodlord Offices. The venue can change between events, so it's best to check our [meetup page](https://www.meetup.com/dotnetsheff/) before travelling.

- question: What time do I need to arrive at the venue?
  answer: >
    If you're attending a talk try to arrive between 18:15-18:30.

- question: What time do I need to arrive at the venue if I am speaking?
  answer: >
    If you are speaking, try to arrive at 18:00. This gives us some time to make sure everything is working.

- question: Do you provide food and drinks?
  answer: >
    Yes. We usually provide free pizza, beer, and soft drinks during the event.

- question: Do you cater for dietary requirements?
  answer: >
    Of course, send us a message before the event and we will do our best to cater for your needs.

- question: Are you close to public transport?
  answer: >
    Yes. Our venues are usually close to Sheffield train station, bus routes, or tram stops. Check the event venue on our [meetup page](https://www.meetup.com/dotnetsheff/) before travelling.

- question: Does the venue have parking?
  answer: >
    We don't usually provide designated parking. Check the event venue and nearby parking options before travelling.

- question: Can I speak at dotnetsheff?
  answer: >
    Yes. We welcome talks across software development, .NET, AI, web, cloud, games, architecture, and modern engineering. Please get in touch via [Twitter (@dotnetsheff)](https://x.com/dotnetsheff) or email [organisers@dotnetsheff.co.uk](mailto:organisers@dotnetsheff.co.uk).

- question: I missed the last event, can I watch it online?
  answer: >
    Many of our events are available via our [videos page](/pages/videos/) so you can revisit them later.

- question: I am new to tech or have never used .NET. Can I still attend?
  answer: >
    Yes. Whether you're a student, junior developer, experienced engineer, or just curious about tech, you're welcome.

- question: Can you advertise my job?
  answer: >
    We don't advertise jobs during the event. We want the event to focus on sharing and learning, but you're welcome to come along and network.
